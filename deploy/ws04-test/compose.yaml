# SPDX-License-Identifier: Apache-2.0
# The test bot @framytest_bot on ws04, in /opt/stacks/framy-test.
#
# It shares production's database: the framy schema in core-postgres, as the
# role framy_core, over core_net (docs/design.md, Stacks). FRAMY_STACK=test
# keeps its River queues, chat runs, album cache and getUpdates offset apart
# from production's; the catalog, the rates, the sweep of uploads and the
# operator chat are production's. A person has one history on both sites.
# The test bot runs dev, so it applies dev's migrations to production's
# schema first: they have to be additive (AGENTS.md, Migrations).
#
# It shares the R2 bucket and the object keys with production (no R2_PREFIX):
# both read every person's files. It talks to the cloud Bot API.
#
# With production's KEK, R2 token and database role, whatever it runs acts on
# production's data (docs/design.md, Stacks). So the image is pulled, never
# built here: FRAMY_IMAGE names a pre-release of dev that the release
# workflow published after CI, by digest, before production takes it
# (docs/releases.md):
#
#   FRAMY_IMAGE=ghcr.io/freshlabdev/framy@sha256:<digest>
#
# ws04 deploy framy-test pulls it. Its sessions are its own: a cookie or a
# token of the test bot signs nobody in on production.
#
# .env holds FRAMY_IMAGE, R2_ACCOUNT_ID and TRUSTED_PROXIES, and
# R2_INCOMING_BUCKET when production's .env names one (the same bucket, with
# copies of production's r2-incoming-access-key-id and
# r2-incoming-secret-access-key), for this file alone: the container gets
# only what environment: names, as production's does. The files in secrets/
# belong to uid 10001, the image's user, mode 0400: database-url
# (production's, the same role and password), bot-token, kek (a copy of
# production's: the keys people connect are stored once for both; only
# production rewraps them, so a new line goes into production's file first
# and is copied here once production has restarted, docs/design.md, Keys at
# rest; like production's, it must stay out of the host's backup of this
# directory), r2-access-key-id, r2-secret-access-key, openrouter-key,
# hook-path-secret
# (head -c 32 /dev/urandom | base64), and telegram-login-client-id and
# telegram-login-client-secret: the OpenID Connect client of @framytest_bot
# in BotFather (Login Widget, with the redirect URI
# https://framy-test.ws04.cc/auth/callback and RS256), and
# openrouter-webhook-secret: the webhook signing secret of the OpenRouter
# workspace that openrouter-key belongs to (Workspace settings, Webhooks).
#
# The site is https://framy-test.ws04.cc: the ws04-management tunnel routes
# it to framy-test-bot:8080 over the external network management, and
# TRUSTED_PROXIES is the address of cloudflared alone, as production's.
# /metrics answers on 127.0.0.1:9090 inside the container only.
# No port is published to the host.
#
# openrouter-key is framy's own key, the same one production pays the free
# allowance with, and the daily budget is counted once over both bots.
name: framy-test

services:
  bot:
    image: ${FRAMY_IMAGE:?FRAMY_IMAGE must be an immutable GHCR reference}
    container_name: framy-test-bot
    restart: unless-stopped
    # Longer than a stop takes: runs in progress get JOBS_STOP_GRACE (3m30s)
    # and 10 s to return once cut short, beside the servers' 20 s, so 4m
    # leaves 20 s before Docker's SIGKILL.
    stop_grace_period: 4m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # As production's: the image cannot be written to, only the volumes
    # below and /tmp.
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777,size=64m,noexec,nosuid
    # Four of the host's twelve cores, so a burst of clips leaves the rest
    # to core-postgres and the other stacks; Go's GOMAXPROCS follows the
    # limit, and ffmpeg is told its threads (internal/media). Each ffmpeg
    # takes up to about 50 threads for a large HEIC and 30 for a clip, and
    # four photos and two clips run at once (internal/api), so the PIDs
    # leave room for those, the loop and the runtime: at the limit no
    # thread can start, and a Go runtime that cannot start one dies.
    cpus: 4
    pids_limit: 512
    mem_limit: 1g
    environment:
      FRAMY_STACK: test
      # Never PgBouncer: River's listener needs a real session.
      DATABASE_URL_FILE: /run/secrets/database-url
      HTTP_ADDR: :8080
      METRICS_ADDR: 127.0.0.1:9090
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/bot-token
      FRAMY_KEK_FILE: /run/secrets/kek
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID must be set}
      R2_BUCKET: framy
      # One schema, one set of keys.
      R2_PREFIX: ""
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2-access-key-id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2-secret-access-key
      # The clips' own bucket when .env names one; its token is read only then.
      R2_INCOMING_BUCKET: ${R2_INCOMING_BUCKET:-}
      R2_INCOMING_ACCESS_KEY_ID_FILE: /run/secrets/r2-incoming-access-key-id
      R2_INCOMING_SECRET_ACCESS_KEY_FILE: /run/secrets/r2-incoming-secret-access-key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter-key
      SITE_URL: https://framy-test.ws04.cc
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES must be the address of cloudflared on management}
      HOOK_PATH_SECRET_FILE: /run/secrets/hook-path-secret
      OPENROUTER_WEBHOOK_SECRET_FILE: /run/secrets/openrouter-webhook-secret
      TELEGRAM_LOGIN_CLIENT_ID_FILE: /run/secrets/telegram-login-client-id
      TELEGRAM_LOGIN_CLIENT_SECRET_FILE: /run/secrets/telegram-login-client-secret
      WORK_DIR: /var/lib/framy/work
      ANIM_CACHE_DIR: /var/lib/framy/anim
    volumes:
      - ./secrets:/run/secrets:ro
      - work:/var/lib/framy/work
      - anim:/var/lib/framy/anim
    networks: [core_net, management]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  work:
  anim:

networks:
  core_net:
    external: true
    name: core_net
  management:
    external: true
