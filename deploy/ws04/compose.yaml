# SPDX-License-Identifier: Apache-2.0
# The production bot @framyin_bot and the site https://framy.ws04.cc on ws04,
# in /opt/stacks/framy. Joins the shared core_net / core-postgres. The test
# bot shares its schema; FRAMY_STACK is unset here, which makes this process
# production, the one that keeps the shared tables (docs/design.md, Stacks).
#
# The image is pulled, never built here: FRAMY_IMAGE names what the release
# workflow published, by digest (docs/releases.md):
#
#   FRAMY_IMAGE=ghcr.io/freshlabdev/framy@sha256:<digest>
#
# .env holds FRAMY_IMAGE, FRAMY_CORE_PASSWORD (the same as in core's .env),
# R2_ACCOUNT_ID, TRUSTED_PROXIES, BOT_API_TOKEN (see the Bot API mount below)
# and, if wanted, OPERATOR_CHAT_ID. The files in secrets/ belong to uid 101,
# mode 0400: bot-token, kek (a line "1:" and 32 random bytes in base64),
# r2-access-key-id, r2-secret-access-key, openrouter-key, hook-path-secret
# (head -c 32 /dev/urandom | base64), openrouter-webhook-secret (the signing
# secret of the OpenRouter workspace openrouter-key belongs to) and, for
# sign-in on the site, telegram-login-client-id and
# telegram-login-client-secret: the OpenID Connect client of @framyin_bot in
# BotFather with the redirect URI https://framy.ws04.cc/auth/callback. Without
# those two the site has no sign-in and the Mini App still works.
#
# Telegram goes through the family's telegram-bot-api in --local mode, which
# answers getFile with a path on its own disk and serves no files over HTTP.
# The bot's own media directory, named after its token, is mounted at the
# server's path, and nothing else of the server: its parent holds every other
# bot's directory, each named after that bot's token. Compose cannot read the
# token from secrets/, so BOT_API_TOKEN in .env repeats it for the two paths
# only; it is not passed into the container. framy checks at start that the
# directory is there and writable, so a token changed in one place and not the
# other stops it at once.
#
# The server writes as uid 101 and framy deletes what it has read, so framy
# runs as 101 too. That is why work/ and anim/ are directories here owned by
# 101 rather than named volumes, which would take the image's uid 10001.
#
# The site is public through the ws04-management tunnel on the management
# network, which maps framy.ws04.cc to http://framy-bot:8080. TRUSTED_PROXIES
# is that network's range. No port is published to the host, so
# CF-Connecting-IP can be trusted. /metrics answers on 9090 on the Docker
# networks only.
#
# The database is core-postgres directly, never PgBouncer: River's listener
# needs a real session.
name: framy

services:
  bot:
    image: ${FRAMY_IMAGE:?FRAMY_IMAGE must be an immutable GHCR reference}
    container_name: framy-bot
    restart: unless-stopped
    user: "101:101"
    # Longer than JOBS_STOP_GRACE (3m30s): a stop waits for runs in progress.
    stop_grace_period: 4m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    environment:
      DATABASE_URL: "postgres://framy_core:${FRAMY_CORE_PASSWORD:?FRAMY_CORE_PASSWORD must be set}@core-postgres:5432/core?sslmode=disable"
      AUTO_MIGRATE: "true"
      HTTP_ADDR: :8080
      METRICS_ADDR: :9090
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/bot-token
      TELEGRAM_API_BASE: ${TELEGRAM_API_BASE:-http://telegram-bot-api-next:8081}
      BOT_API_FILES_DIR: /var/lib/telegram-bot-api-files
      FRAMY_KEK_FILE: /run/secrets/kek
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID must be set}
      R2_BUCKET: framy
      R2_ACCESS_KEY_ID_FILE: /run/secrets/r2-access-key-id
      R2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2-secret-access-key
      OPENROUTER_API_KEY_FILE: /run/secrets/openrouter-key
      SITE_URL: https://framy.ws04.cc
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:?TRUSTED_PROXIES must be the management network range}
      HOOK_PATH_SECRET_FILE: /run/secrets/hook-path-secret
      OPENROUTER_WEBHOOK_SECRET_FILE: /run/secrets/openrouter-webhook-secret
      TELEGRAM_LOGIN_CLIENT_ID_FILE: ${TELEGRAM_LOGIN_CLIENT_ID_FILE:-}
      TELEGRAM_LOGIN_CLIENT_SECRET_FILE: ${TELEGRAM_LOGIN_CLIENT_SECRET_FILE:-}
      OPERATOR_CHAT_ID: ${OPERATOR_CHAT_ID:-}
      WORK_DIR: /var/lib/framy/work
      ANIM_CACHE_DIR: /var/lib/framy/anim
    volumes:
      - ./secrets:/run/secrets:ro
      - ./work:/var/lib/framy/work
      - ./anim:/var/lib/framy/anim
      # Long syntax: the token has a colon, which the short form splits on.
      # The source must exist and belong to 101 before the first start, or
      # Docker makes it as root and neither side can write in it.
      - type: bind
        source: /opt/stacks/telegram-bot-api-next/files/${BOT_API_TOKEN:?BOT_API_TOKEN must be set for the Bot API mount}
        target: /var/lib/telegram-bot-api-files/${BOT_API_TOKEN}
        bind:
          propagation: rprivate
    expose:
      - "8080"
      - "9090"
    networks: [core_net, management, telegram_bot_api_net]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  core_net:
    external: true
    name: core_net
  management:
    external: true
    name: management
  telegram_bot_api_net:
    external: true
    name: telegram_bot_api_net
