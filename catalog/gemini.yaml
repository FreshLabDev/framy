# SPDX-License-Identifier: Apache-2.0
#
# Gemini API models, written by hand: Google publishes no catalog to sync.
# The form is OpenRouter's for an image endpoint: supported_parameters as
# enum, range or boolean, and pricing as billable, unit and cost_usd.
# overlay.yaml joins each one to its model.
#
# Sources, read on 26 October 2026 (docs/research/images.md, sections 2 and 4;
# docs/research/video.md, section 4):
#   https://ai.google.dev/gemini-api/docs/image-generation
#   https://ai.google.dev/gemini-api/docs/pricing
#   https://ai.google.dev/gemini-api/docs/omni
#
# Not described: gemini-2.5-flash-image, which is on Google's deprecation
# page, and the *-preview ids, shut down on 25 June 2026.

provider: gemini

models:
  - id: gemini-nano-banana-2.1
    kind: image
    name: Nano Banana 2.1
    input_modalities: [text, image]
    supported_parameters:
      # No 512 on this model.
      resolution: {type: enum, values: [1K, 2K, 4K]}
      aspect_ratio:
        type: enum
        values: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9", "1:4", "4:1", "1:8", "8:1"]
      n: {type: range, min: 1, max: 1}
      # Up to 10 objects and 4 characters.
      input_references: {type: range, min: 0, max: 14}
      thinking_level: {type: enum, values: [minimal, medium, high]}
      google_search: {type: boolean}
    pricing:
      - {billable: input_text, unit: token, cost_usd: 0.0000015}
      - {billable: input_image, unit: token, cost_usd: 0.0000015}
      # Text and thinking.
      - {billable: output_text, unit: token, cost_usd: 0.0000075}
      - {billable: output_image, unit: token, cost_usd: 0.00003}

  - id: gemini-3.1-flash-image
    kind: image
    name: Nano Banana 2
    input_modalities: [text, image]
    supported_parameters:
      resolution: {type: enum, values: ["512", 1K, 2K, 4K]}
      aspect_ratio:
        type: enum
        values: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9", "1:4", "4:1", "1:8", "8:1"]
      n: {type: range, min: 1, max: 1}
      input_references: {type: range, min: 0, max: 14}
      thinking_level: {type: enum, values: [minimal, high]}
      google_search: {type: boolean}
    pricing:
      - {billable: input_text, unit: token, cost_usd: 0.0000005}
      - {billable: input_image, unit: token, cost_usd: 0.0000005}
      - {billable: output_text, unit: token, cost_usd: 0.000003}
      - {billable: output_image, unit: token, cost_usd: 0.00006}

  - id: gemini-3.1-flash-lite-image
    kind: image
    name: Nano Banana 2 Lite
    input_modalities: [text, image]
    supported_parameters:
      resolution: {type: enum, values: [1K]}
      # The same 14 as Nano Banana 2, as OpenRouter lists them for Lite.
      aspect_ratio:
        type: enum
        values: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9", "1:4", "4:1", "1:8", "8:1"]
      n: {type: range, min: 1, max: 1}
      input_references: {type: range, min: 0, max: 14}
      thinking_level: {type: enum, values: [minimal, high]}
      # Lite has no search grounding.
    pricing:
      - {billable: input_text, unit: token, cost_usd: 0.00000025}
      - {billable: input_image, unit: token, cost_usd: 0.00000025}
      - {billable: output_text, unit: token, cost_usd: 0.0000015}
      - {billable: output_image, unit: token, cost_usd: 0.00003}

  - id: gemini-3-pro-image
    kind: image
    name: Nano Banana Pro
    input_modalities: [text, image]
    supported_parameters:
      resolution: {type: enum, values: [1K, 2K, 4K]}
      aspect_ratio:
        type: enum
        values: ["1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9", "21:9"]
      n: {type: range, min: 1, max: 1}
      # 6 objects, 5 characters and 3 style references.
      input_references: {type: range, min: 0, max: 14}
      google_search: {type: boolean}
    pricing:
      - {billable: input_text, unit: token, cost_usd: 0.000002}
      - {billable: input_image, unit: token, cost_usd: 0.000002}
      - {billable: output_text, unit: token, cost_usd: 0.000012}
      - {billable: output_image, unit: token, cost_usd: 0.00012}

  - id: gemini-omni-1.1-flash
    kind: video
    name: Gemini Omni 1.1 Flash
    input_modalities: [text, image, video]
    supported_parameters:
      # The model picks the length, 3 to 10 seconds; there is no duration.
      # 1080p and 4K are upscaled from 720p, the default. The Interactions
      # API spells 4K as "4k", and the video adapter must send it so.
      resolution: {type: enum, values: [360p, 720p, 1080p, 4K]}
      aspect_ratio: {type: enum, values: ["16:9", "9:16"]}
      frame_images: {type: enum, values: [first_frame, last_frame]}
    pricing:
      - {billable: input_text, unit: token, cost_usd: 0.0000015}
      - {billable: input_image, unit: token, cost_usd: 0.0000015}
      - {billable: input_video, unit: token, cost_usd: 0.0000015}
      # 5,792 tokens per second of 720p, about $0.10 a second.
      - {billable: output_video, unit: token, cost_usd: 0.0000175}
