# SPDX-License-Identifier: Apache-2.0
#
# What no API says about the models, laid over OpenRouter's catalogs and the
# hand-written openai.yaml and gemini.yaml. The fields are explained in
# docs/design.md, "Model catalog", and in internal/catalog/files.go.
#
# A model's id is its OpenRouter id. A model OpenRouter does not carry gets an
# id here. Every hand-written offer is listed under its model: names are not
# guessed, so gemini:gemini-3-pro-image joins google/gemini-3-pro-image only
# because this file says so.
#
# A model that leaves OpenRouter is disabled by the sync, not by editing this
# file; an entry for it only turns into a warning in the log.

hide_expiring_within_days: 14

hide:
  - match: google/*-preview
    why: a preview id Google shut down on 25 June 2026; the released model is listed
  - match: openai/gpt-5*-image*
    why: a chat model wrapped around GPT Image; the image models are listed themselves
  - match: openai/gpt-image-1*
    why: OpenAI shut gpt-image-1 down on 23 October 2026 and closes gpt-image-1-mini on 1 December 2026
  - match: meta/muse-image
    why: an evaluation slug, reachable only through chat completions
  - match: openrouter/auto*
    why: a router, not a model

models:
  # Images.

  # price.openai_tokens is the base of the token formula in OpenAI's own
  # calculator, by quality (docs/research/images.md, section 3.1).
  openai/gpt-image-2.5-sunburst:
    offers: [openai:gpt-image-2.5-sunburst]
    featured: true
    effort: {parameter: quality, values: [low, medium, high, xhigh, max]}
    # Neither price can be known before the run.
    exclude: {quality: [auto], aspect_ratio: [auto]}
    price:
      openai_tokens: {low: 16, medium: 24, high: 48, xhigh: 64, max: 96}

  openai/gpt-image-2.5-flare:
    offers: [openai:gpt-image-2.5-flare]
    featured: true
    effort: {parameter: quality, values: [low, medium, high, xhigh, max]}
    exclude: {quality: [auto], aspect_ratio: [auto]}
    price:
      openai_tokens: {low: 16, medium: 24, high: 48, xhigh: 64, max: 96}

  openai/gpt-image-2:
    offers: [openai:gpt-image-2]
    exclude: {quality: [auto], aspect_ratio: [auto]}
    price:
      openai_tokens: {low: 16, medium: 48, high: 96}

  # price.tokens of the Gemini models is Google's count of tokens per image,
  # by resolution (docs/research/images.md, section 4.1).
  google/gemini-nano-banana-2.1:
    offers: [gemini:gemini-nano-banana-2.1]
    featured: true
    # Only the direct offer has thinking_level.
    effort: {parameter: thinking_level, values: [minimal, medium, high]}
    price:
      # The guide says 2,520 tokens at 4K; the pricing page, which bills,
      # says 3,780 ($0.113).
      tokens: {output_image: {1K: 1120, 2K: 1680, 4K: 3780}}

  google/gemini-3.1-flash-image:
    name: Nano Banana 2
    offers: [gemini:gemini-3.1-flash-image]
    effort: {parameter: thinking_level, values: [minimal, high]}
    price:
      tokens: {output_image: {"512": 747, 1K: 1120, 2K: 1680, 4K: 2520}}

  google/gemini-3.1-flash-lite-image:
    name: Nano Banana 2 Lite
    offers: [gemini:gemini-3.1-flash-lite-image]
    effort: {parameter: thinking_level, values: [minimal, high]}
    price:
      tokens: {output_image: {1K: 1120}}

  google/gemini-3-pro-image:
    name: Nano Banana Pro
    offers: [gemini:gemini-3-pro-image]
    featured: true
    price:
      tokens:
        output_image: {1K: 1120, 2K: 1120, 4K: 2000}
        input_image: {"*": 560}

  google/gemini-2.5-flash-image:
    hide: on Google's deprecation page, and its own pages disagree on the shutdown date

  # Microsoft publishes no token count. About 1,024 a 1024x1024 image is
  # Artificial Analysis's price per image divided by the rate, on all four
  # models: $0.0195, $0.0389, $0.048 and $0.108. An input image takes about
  # 1,050 tokens a megapixel: 250 at 512x512, 1,100 at 1024x1024 and 2,470
  # at 2048x1152, measured on 2.6 Flash on 27 October 2026. 1,100 keeps the
  # estimate from coming out low.
  microsoft/mai-image-2.5:
    price:
      tokens: {output_image: {"*": 1024}}
      input_tokens_per_mp: 1100

  microsoft/mai-image-2.5-pro:
    price:
      tokens: {output_image: {"*": 1024}}
      input_tokens_per_mp: 1100

  microsoft/mai-image-2.6:
    featured: true
    price:
      tokens: {output_image: {"*": 1024}}
      input_tokens_per_mp: 1100

  # The free image model (owner, 26 October 2026).
  microsoft/mai-image-2.6-flash:
    free: true
    price:
      tokens: {output_image: {"*": 1024}}
      input_tokens_per_mp: 1100

  # The free allowance's model for albums of more than 5 photos, and its
  # fallback; the blind test confirms it (docs/design.md, Free tier).
  black-forest-labs/flux-3-image-klein:
    free: true

  # Krea's dearer variants are for style references and moodboards, which
  # framy does not send.
  krea/krea-2-large:
    price:
      variants: {style_references: {image_style_references: "*"}, moodboards: {moodboards: "*"}}
  krea/krea-2-medium:
    price:
      variants: {style_references: {image_style_references: "*"}, moodboards: {moodboards: "*"}}
  krea/krea-2-medium-turbo:
    price:
      variants: {style_references: {image_style_references: "*"}, moodboards: {moodboards: "*"}}
  krea/k3-edit:
    price:
      variants: {high_thinking_surcharge: {thinking_mode: high}}

  sourceful/riverflow-v2-pro:
    price:
      skip:
        input_reference: super-resolution references, which framy does not send
        input_font: font files, which framy does not send yet
  sourceful/riverflow-v2-fast:
    price:
      skip:
        input_reference: super-resolution references, which framy does not send
        input_font: font files, which framy does not send yet
  sourceful/riverflow-v2.5-fast:
    price:
      from: the price grows with reasoning, resolution and the image's complexity

  black-forest-labs/flux-3-image:
    featured: true

  bytedance-seed/seedream-5-0-pro:
    featured: true

  # Up to 20 references.
  tencent/hy-image-v3.5-preview:
    featured: true

  # SVG output.
  recraft/recraft-v4.1-vector:
    featured: true

  # Draws text in the fonts it is given. Its reasoning setting is not on
  # OpenRouter's Images API, neither as a parameter nor as a pass-through, so
  # it has no effort here.
  sourceful/riverflow-v2.5-pro:
    featured: true
    price:
      from: the price grows with reasoning, resolution and the image's complexity

  # Video. Reference counts, continuation and the face policy are filled in
  # only where a source says so (docs/research/video.md, sections 5.4 and 6);
  # the rest waits for the tests of the video stage.

  google/veo-3.1:
    featured: true
    references: {image: 3}
    faces: adults
    passthrough:
      negativePrompt: {type: text}

  google/veo-3.1-fast:
    featured: true
    references: {image: 3}
    faces: adults
    passthrough:
      negativePrompt: {type: text}

  # Lite takes no reference images.
  google/veo-3.1-lite:
    featured: true
    faces: adults
    passthrough:
      negativePrompt: {type: text}

  kwaivgi/kling-v3.0-pro:
    featured: true
    passthrough:
      negative_prompt: {type: text}

  kwaivgi/kling-v3.0-std:
    passthrough:
      negative_prompt: {type: text}

  kwaivgi/kling-video-o1:
    passthrough:
      negative_prompt: {type: text}

  # Real faces in references are refused, by third-party reports; BytePlus's
  # own page was not reached.
  bytedance/seedance-2.0:
    featured: true
    faces: rejected

  bytedance/seedance-2.5:
    featured: true
    faces: rejected

  bytedance/seedance-2.0-fast:
    faces: rejected

  bytedance/seedance-2.0-mini:
    faces: rejected

  alibaba/wan-3.0:
    featured: true

  alibaba/wan-2.7:
    passthrough:
      negative_prompt: {type: text}

  alibaba/wan-2.6:
    passthrough:
      negative_prompt: {type: text}

  minimax/hailuo-3-max:
    featured: true

  # The free videos, a proposal until the blind test: HeyGen, and Grok Lite
  # as the cheaper one from another vendor.
  x-ai/grok-imagine-video-1.5-lite:
    featured: true
    free: true

  heygen/heygen-video-1:
    featured: true
    free: true

  google/gemini-omni-1.1-flash:
    name: Gemini Omni 1.1 Flash
    maker: Google
    offers: [gemini:gemini-omni-1.1-flash]
    featured: true
    # previous_interaction_id of the Interactions API.
    continue: true
    # The model picks the length; Google counts 5,792 tokens a second of
    # 720p, about $0.10. Other resolutions have no published count.
    picks_length: {min: 3, max: 10}
    price:
      tokens: {output_video: {720p: 5792}}
    # An uploaded video goes through the Files API, up to 10 s, and not in
    # the EEA, Switzerland and the UK; its own results have no such limit.
    source_video: {max_seconds: 10}
    # No recognizable people, and no minors in the EEA, Switzerland and the UK.
    faces: adults

  # Editors and upscalers run on an attached video: an uploaded one, or a
  # finished one through "Edit". They are in the same video list, dimmed
  # until a video is attached. Other models that take video input (Seedance
  # 2.x, Hailuo 3, Wan 3.0, FLUX 3 Video, HeyGen Video) need no entry for it.

  # Text instructions and keyframes; whether the result keeps the source's
  # length is not published. At least 56 cents a run.
  runway/aleph-2:
    featured: true
    source_video: {required: true}

  # Keeps the source's length, aspect ratio and sound; above 720p the source
  # is scaled down to 720p.
  # The free video edit, a clip up to 5 s (owner, 27 October 2026).
  black-forest-labs/flux-video-edit:
    featured: true
    free: true
    source_video: {required: true, max_seconds: 15, max_mib: 50, keeps_length: true}

  black-forest-labs/flux-video-upscale:
    source_video: {required: true, keeps_length: true}

  heygen/avatar-iv:
    hide: a talking head from a photo and a voice; the composer takes no voice yet
