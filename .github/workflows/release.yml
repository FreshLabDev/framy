# SPDX-License-Identifier: Apache-2.0
# Publishes the image and the GitHub Release for a tag. See docs/releases.md.
name: Release

on:
  push:
    tags: ["v*"]
  # The way round CI, for when it could not run on the tagged commit (an Actions
  # outage, a spending limit) and the release cannot wait. It cannot happen by
  # accident: it is started by hand, names a tag that already exists, and the
  # reason is printed at the top of the release notes.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish without running CI
        required: true
        type: string
      reason:
        description: Why CI is skipped (printed at the top of the release notes)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build image and publish release
    needs: ci
    # A pushed tag publishes only after CI passed on it; the manual run above is
    # the only way to publish without that, and it says so in the notes.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Build, media tests and scan take about six minutes; a hung build or
    # push fails instead of holding the release for six hours.
    timeout-minutes: 25
    # For the storage tests among the media tests of the image built here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: framy
          POSTGRES_PASSWORD: framy
          POSTGRES_DB: framy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U framy -d framy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SKIP_REASON: ${{ inputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Require the tag on the branch its channel is published from
        id: meta
        # docs/versioning.md: pre-releases are tagged on dev, stable releases on
        # main. A stable tag that never went through main would publish
        # something the production branch has not seen.
        run: |
          commit=$(git rev-parse "refs/tags/${TAG}^{commit}")
          if printf '%s' "${TAG}" | grep -Eq -- '-(alpha|beta|rc)\.'; then
            branch=dev
            echo "prerelease=true" >>"$GITHUB_OUTPUT"
          else
            branch=main
            echo "prerelease=false" >>"$GITHUB_OUTPUT"
          fi
          git fetch --no-tags origin "${branch}:refs/remotes/origin/${branch}"
          if ! git merge-base --is-ancestor "${commit}" "origin/${branch}"; then
            echo "tag ${TAG} is not an ancestor of origin/${branch}"
            exit 1
          fi
          echo "commit=${commit}" >>"$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"

      - name: Extract changelog section
        id: changelog
        run: |
          notes_file="$(mktemp)"
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            printf '> **Published without CI.** %s\n\n' "${SKIP_REASON}" >"${notes_file}"
          fi
          # Match the heading by literal prefix AND a boundary (space or
          # end-of-line) so e.g. "## v1.0.0" does not capture "## v1.0.0-alpha.1".
          section="$(mktemp)"
          awk -v ver="## ${TAG}" '
            index($0, ver) == 1 && (length($0) == length(ver) || substr($0, length(ver) + 1, 1) == " ") { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >"${section}"
          if [ ! -s "${section}" ]; then
            # A release whose notes are the word "Release" tells nobody anything,
            # and the changelog section is the only place they are written.
            echo "CHANGELOG.md has no '## ${TAG}' section"
            exit 1
          fi
          cat "${section}" >>"${notes_file}"
          echo "file=${notes_file}" >>"$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # docs/versioning.md: a published version is never moved. A run started
      # again after it had pushed the image (the release step failed, say)
      # would build anew, with another build date and Alpine's packages of
      # that day, and move the tag to a digest nobody tested, while
      # production pins the first. So an image already under the tag is kept
      # and the run only finishes the release with it. Anything but "not
      # found" stops the run before it pushes.
      - name: Keep an image already published under the tag
        id: published
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          err="$(mktemp)"
          if manifest="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' 2>"${err}")"; then
            digest="$(jq -r .digest <<<"${manifest}")"
            case "${digest}" in
              sha256:*) ;;
              *) echo "${IMAGE}:${TAG} is published, but its digest could not be read"; exit 1 ;;
            esac
            echo "::notice::${IMAGE}:${TAG} is already published as ${digest}; this run keeps it and builds nothing"
            echo "digest=${digest}" >>"$GITHUB_OUTPUT"
          elif grep -qi 'not found' "${err}"; then
            echo "${IMAGE}:${TAG} is not published yet"
          else
            cat "${err}"
            echo "could not tell whether ${IMAGE}:${TAG} is published, so nothing is pushed"
            exit 1
          fi

      # The image is pushed by its digest alone, tested and scanned as it
      # is in the registry, and only then given its tags: the build CI
      # tested is another one, made minutes earlier with that minute's
      # packages of Alpine, so what production pulls is checked here.
      - name: Build and push the image by digest
        id: build
        if: steps.published.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ steps.meta.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ env.TAG }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DATE=${{ steps.meta.outputs.date }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.build.outcome == 'success'
        with:
          go-version-file: go.mod
          cache: true

      - name: Media tests in the pushed image
        if: steps.build.outcome == 'success'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          FRAMY_TEST_DATABASE_URL: postgres://framy:framy@localhost:5432/framy_test?sslmode=disable
        run: |
          docker pull "${IMAGE}"
          .github/scripts/media-tests.sh "${IMAGE}"

      # As CI scans its own build (docs/releases.md, When the image scan
      # fails).
      - name: Scan the pushed image's packages
        if: steps.build.outcome == 'success'
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: registry:${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          config: .grype.yaml
          only-fixed: true
          severity-cutoff: high
          output-format: table

      # A single source is copied as it is, so the tags name the digest
      # that was tested; the check makes sure of it.
      - name: Tag the tested image
        if: steps.build.outcome == 'success'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:sha-${COMMIT}" "${IMAGE}@${DIGEST}"
          tagged="$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          if [ "${tagged}" != "${DIGEST}" ]; then
            echo "${IMAGE}:${TAG} is ${tagged}, not the tested ${DIGEST}"
            exit 1
          fi

      - name: Record the image digest
        # docs/releases.md tells the operator to pin this digest; the notes are
        # where it is read from.
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.published.outputs.digest || steps.build.outputs.digest }}
          NOTES_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          printf '\n### Container image\n\n`%s@%s`\n' "$IMAGE" "$DIGEST" >>"$NOTES_FILE"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.changelog.outputs.file }}
        run: |
          flags=""
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            flags="--prerelease"
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file "${NOTES_FILE}" ${flags}
          else
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file "${NOTES_FILE}" ${flags}
          fi
