# SPDX-License-Identifier: Apache-2.0
# Version updates open against dev, like every other change; they reach main
# with the next release. One grouped PR per ecosystem keeps the queue short.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      github_actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # A dependency joins the first group it matches. River comes alone: an
    # upgrade can bring migrations of its own, which the test bot would apply
    # to production's schema first (docs/design.md, Stacks), and
    # TestRiverBringsNoMigrationProductionLacks stops such a pull request
    # without holding back the rest.
    groups:
      river:
        patterns: ["github.com/riverqueue/*"]
      gomod:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      docker:
        patterns: ["*"]
